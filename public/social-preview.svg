<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient: sunset sky with meadow tones -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fdf4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Light beam effect -->
  <ellipse cx="600" cy="-100" rx="300" ry="400" fill="white" opacity="0.3" transform="rotate(-15 600 200)"/>
  
  <!-- Code motif (left side) -->
  <g opacity="0.15" transform="translate(50, 150)">
    <text font-family="monospace" font-size="32" fill="#334155" font-weight="600">
      <tspan x="0" y="0">&lt;?php</tspan>
      <tspan x="20" y="50">class Developer {</tspan>
      <tspan x="40" y="100">public function</tspan>
      <tspan x="40" y="150">modernize($legacy)</tspan>
      <tspan x="40" y="200">{...}</tspan>
      <tspan x="20" y="250">}</tspan>
    </text>
  </g>
  
  <!-- Main content (right side) -->
  <g transform="translate(550, 200)">
    <!-- Name with gradient -->
    <text font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#textGradient)">
      <tspan x="0" y="0">Lars Moelleken</tspan>
    </text>
    
    <!-- Title -->
    <text font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#334155">
      <tspan x="0" y="60">Senior PHP Developer</tspan>
      <tspan x="0" y="105">& Software Architect</tspan>
    </text>
    
    <!-- Key highlights -->
    <g transform="translate(0, 170)">
      <text font-family="Inter, system-ui, sans-serif" font-size="24" fill="#64748b">
        <tspan x="0" y="0">✓ 20+ years experience</tspan>
        <tspan x="0" y="40">✓ Legacy modernization expert</tspan>
        <tspan x="0" y="80">✓ Open source maintainer</tspan>
      </text>
    </g>
  </g>
  
  <!-- Tech stack badges (bottom) -->
  <g transform="translate(550, 550)">
    <rect width="80" height="30" rx="5" fill="#f43f5e" opacity="0.9"/>
    <text x="40" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">PHP</text>
    
    <rect x="95" width="100" height="30" rx="5" fill="#fb923c" opacity="0.9"/>
    <text x="145" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">PHPStan</text>
    
    <rect x="210" width="90" height="30" rx="5" fill="#166534" opacity="0.9"/>
    <text x="255" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Rector</text>
    
    <rect x="315" width="90" height="30" rx="5" fill="#64748b" opacity="0.9"/>
    <text x="360" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Docker</text>
  </g>
</svg>
