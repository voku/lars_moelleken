<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lars Moelleken - Senior PHP Developer & Software Architect</title>
    <meta name="description" content="Portfolio von Lars Moelleken, Senior PHP-Entwickler mit 20+ Jahren Erfahrung in Legacy-Modernisierung und Softwarearchitektur.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              meadow: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                800: '#166534',
              },
              sunset: {
                50: '#fff1f2',
                100: '#ffe4e6',
                200: '#fecdd3',
                300: '#fda4af',
                DEFAULT: '#f43f5e', // Brand color
                dark: '#be123c',    // Darker version for better text contrast
              },
              sky: {
                pink: '#fce7f3',
                orange: '#ffedd5',
                glow: '#fff7ed',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
      
      body {
        background-color: #ffffff;
        color: #334155;
      }

      /* Focus visibility for accessibility */
      :focus-visible {
        outline: 3px solid #f43f5e;
        outline-offset: 4px;
        border-radius: 4px;
      }

      /* Screen reader only utility */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      /* Light Beam effect inspired by the image */
      .light-beam {
        position: absolute;
        top: -10%;
        left: 50%;
        transform: translateX(-50%) rotate(-15deg);
        width: 300px;
        height: 150%;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 70%);
        filter: blur(80px);
        pointer-events: none;
        z-index: 0;
      }

      .sunset-sky-bg {
        background: linear-gradient(135deg, #fff7ed 0%, #fce7f3 50%, #f0fdf4 100%);
      }

      .text-sunset-gradient {
        background: linear-gradient(to right, #f43f5e, #ea580c);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .btn-sunset {
        background: linear-gradient(135deg, #f43f5e 0%, #fb923c 100%);
        box-shadow: 0 10px 15px -3px rgba(244, 63, 94, 0.2);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      /* Smooth scrolling is handled via JS for focus management, but adding CSS as fallback */
      html {
        scroll-behavior: smooth;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  <script type="importmap">

}
</script>
</head>
